<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1b5e20"/>
  <g transform="translate(256,256)">
    <!-- Paint bucket -->
    <ellipse cx="20" cy="-60" rx="90" ry="30" fill="#4caf50" opacity="0.9"/>
    <path d="M-70,-60 L-80,100 Q-80,130 -50,130 L90,130 Q120,130 120,100 L110,-60 Z" fill="#388e3c"/>
    <ellipse cx="20" cy="-60" rx="90" ry="30" fill="#66bb6a" opacity="0.7"/>
    <!-- Paint drip -->
    <ellipse cx="20" cy="130" rx="40" ry="12" fill="#2e7d32" opacity="0.5"/>
    <path d="M10,125 Q-5,155 10,175 Q20,190 30,175 Q45,155 30,125 Z" fill="#4caf50"/>
    <!-- Brush handle -->
    <rect x="-120" y="-140" width="30" height="120" rx="8" fill="#8d6e63" transform="rotate(-30)"/>
    <rect x="-110" y="0" width="30" height="40" rx="3" fill="#4caf50" transform="rotate(-30)"/>
  </g>
  <!-- "M" letter for Маляр -->
  <text x="256" y="480" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="#a5d6a7" text-anchor="middle">МЛР</text>
</svg>
